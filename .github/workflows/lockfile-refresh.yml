name: Lockfile Refresh Diagnostic

on:
  push:
    branches:
      - fix/devcontainer-dotfiles-identity

permissions:
  contents: read

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: pnpm
      - name: Refresh lockfile only
        id: refresh
        continue-on-error: true
        shell: bash
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile > lockfile-refresh.log 2>&1
        env:
          HUSKY: 0
      - name: Upload refresh diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lockfile-refresh-log
          path: lockfile-refresh.log
          retention-days: 1
      - name: Upload refreshed lockfile
        if: steps.refresh.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: refreshed-pnpm-lock
          path: pnpm-lock.yaml
          retention-days: 1
      - name: Fail on refresh error
        if: steps.refresh.outcome == 'failure'
        run: exit 1
