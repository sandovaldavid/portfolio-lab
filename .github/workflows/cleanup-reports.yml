name: Cleanup PR Reports

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  cleanup:
    name: Cleanup gh-pages reports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages

      - name: Clean up PR directories
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          echo "PR #${PR_NUMBER} has been closed/merged. Cleaning up reports..."
          
          DELETED=false
          
          if [ -d "prs/${PR_NUMBER}" ]; then
            echo "Deleting prs/${PR_NUMBER}"
            rm -rf "prs/${PR_NUMBER}"
            DELETED=true
          fi
          
          if [ -d "playwright-report/${PR_NUMBER}" ]; then
            echo "Deleting playwright-report/${PR_NUMBER}"
            rm -rf "playwright-report/${PR_NUMBER}"
            DELETED=true
          fi
          
          if [ "$DELETED" = true ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: cleanup reports for closed PR #${PR_NUMBER}"
            git push origin gh-pages
            echo "Cleanup complete."
          else
            echo "No reports found for PR #${PR_NUMBER}."
          fi
