name: Lighthouse CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  lighthouse:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Build project
        run: pnpm build

      - name: Run Lighthouse CI
        run: pnpm lighthouse

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: lighthouse-results/
          retention-days: 30

      - name: Comment PR with Lighthouse results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const resultsDir = 'lighthouse-results';
            if (!fs.existsSync(resultsDir)) return;

            const files = fs.readdirSync(resultsDir).filter(f => f.endsWith('.json') && !f.includes('manifest'));
            if (files.length === 0) return;

            const report = JSON.parse(fs.readFileSync(path.join(resultsDir, files[0]), 'utf8'));
            const cats = report.categories || {};
            const score = s => s ? `${(s.score * 100).toFixed(0)}%` : 'N/A';
            const mark = s => s && s.score >= 0.9 ? '[pass]' : s && s.score >= 0.8 ? '[warn]' : '[fail]';

            const rows = [
              '[info] Lighthouse Audit Results',
              '',
              '| Category | Score | Status |',
              '|----------|-------|--------|',
              '| Performance | ' + score(cats.performance) + ' | ' + mark(cats.performance) + ' |',
              '| Accessibility | ' + score(cats.accessibility) + ' | ' + mark(cats.accessibility) + ' |',
              '| Best Practices | ' + score(cats['best-practices']) + ' | ' + mark(cats['best-practices']) + ' |',
              '| SEO | ' + score(cats.seo) + ' | ' + mark(cats.seo) + ' |',
              '',
              'Full report available in [workflow artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).'
            ];
            const body = rows.join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
