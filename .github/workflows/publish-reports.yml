name: Publish Test Reports to GitHub Pages

on:
  push:
    branches:
      - main
      - develop
  workflow_run:
    workflows: ["E2E Tests", "Lighthouse CI"]
    types:
      - completed

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read
  pull-requests: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish-reports:
    name: Publish to GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      # -------------------------------------------------------------
      # If triggered by a branch push (main/develop):
      # We need to build the project, generate coverage and bundle stats,
      # and update the root reports.
      # -------------------------------------------------------------
      - name: Checkout source code (only on push)
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          path: src-code

      - name: Setup Node.js (only on push)
        if: github.event_name == 'push'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: src-code/pnpm-lock.yaml

      - name: Install pnpm (only on push)
        if: github.event_name == 'push'
        uses: pnpm/action-setup@v6

      - name: Install dependencies & Build (only on push)
        if: github.event_name == 'push'
        run: |
          cd src-code
          pnpm install --frozen-lockfile
          pnpm build
          
          # Generate Coverage
          pnpm test:coverage || true
          
          # Copy to root reports directory on gh-pages checkout
          cd ..
          mkdir -p bundle-analysis
          mkdir -p coverage
          
          cp -r src-code/coverage/. coverage/ 2>/dev/null || echo "[warning] No coverage report found"
          cp src-code/dist/stats.html bundle-analysis/index.html 2>/dev/null || echo "[warning] No bundle stats found"
          cp src-code/.github/reports-template.html index.html
        env:
          HUSKY: 0

      # -------------------------------------------------------------
      # If triggered by workflow_run (E2E Tests / Lighthouse CI):
      # We download the artifacts and save them to the correct PR/branch directory.
      # -------------------------------------------------------------
      - name: Download artifacts (only on workflow_run)
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v3
        with:
          run_id: ${{ github.event.workflow_run.id }}
          path: ./downloaded-artifacts
          workflow: ${{ github.event.workflow_run.name }}

      - name: Extract latest template (only on workflow_run)
        if: github.event_name == 'workflow_run'
        run: |
          git show ${{ github.event.workflow_run.head_sha }}:.github/reports-template.html > index.html || true

      - name: Organize reports (only on workflow_run)
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            mkdir -p playwright
            mkdir -p lighthouse
            
            PR_NUMBER="${{ github.event.workflow_run.pull_requests[0].number }}"
            HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
            
            if [ -n "$PR_NUMBER" ]; then
              echo "Processing PR #${PR_NUMBER}"
              PR_DIR="prs/${PR_NUMBER}"
              mkdir -p "${PR_DIR}/playwright"
              mkdir -p "${PR_DIR}/lighthouse"
              
              if [ -d "downloaded-artifacts/playwright-report" ]; then
                cp -r downloaded-artifacts/playwright-report/. "${PR_DIR}/playwright/"
              fi
              
              if [ -d "downloaded-artifacts/lighthouse-reports" ]; then
                cp -r downloaded-artifacts/lighthouse-reports/. "${PR_DIR}/lighthouse/"
              fi
            else
              echo "Processing branch push: ${HEAD_BRANCH}"
              if [ "$HEAD_BRANCH" = "main" ] || [ "$HEAD_BRANCH" = "develop" ]; then
                if [ -d "downloaded-artifacts/playwright-report" ]; then
                  cp -r downloaded-artifacts/playwright-report/. playwright/
                fi
                
                if [ -d "downloaded-artifacts/lighthouse-reports" ]; then
                  cp -r downloaded-artifacts/lighthouse-reports/. lighthouse/
                fi
              fi
            fi
          fi

      # -------------------------------------------------------------
      # Commit changes back to gh-pages branch
      # -------------------------------------------------------------
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: deploy test reports for ${{ github.event.workflow_run.head_branch || github.ref_name }} (${{ github.event.workflow_run.head_sha || github.sha }})"
            git push origin gh-pages
          else
            echo "No changes to commit"
          fi

      # -------------------------------------------------------------
      # Deploy to GitHub Pages (using official actions runner)
      # -------------------------------------------------------------
      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # -------------------------------------------------------------
      # Comment on PR with links (only on workflow_run)
      # -------------------------------------------------------------
      - name: Comment on PR with reports links
        if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const prs = context.payload.workflow_run.pull_requests;
            if (!prs || prs.length === 0) {
              console.log('No pull requests associated with this workflow run.');
              return;
            }
            const prNumber = prs[0].number;
            const repoName = context.repo.repo;
            const owner = context.repo.owner;
            const MARKER = '<!-- gh-pages-reports-comment -->';
            
            const playwrightUrl = `https://${owner}.github.io/${repoName}/prs/${prNumber}/playwright/`;
            
            const workflowName = context.payload.workflow_run.name;
            const hasLighthouse = workflowName === 'Lighthouse CI';
            const hasPlaywright = workflowName === 'E2E Tests';
            
            let body = MARKER + '\n### 📊 Live Test Reports (GitHub Pages)\n\nTest reports have been published to GitHub Pages:\n';
            if (hasPlaywright) {
              body += `* 🎭 **Playwright E2E:** [Open Report](${playwrightUrl})\n`;
            }
            if (hasLighthouse) {
              const lighthouseUrl = `https://${owner}.github.io/${repoName}/prs/${prNumber}/lighthouse/`;
              body += `* 🔦 **Lighthouse Audits:** [Open Report](${lighthouseUrl})\n`;
            }
            body += '\n_Note: It might take a minute for GitHub Pages to update after deployment._';
            
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo: repoName,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo: repoName,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo: repoName,
                issue_number: prNumber,
                body,
              });
            }
