name: Build Reports

# Note: GitHub Pages is disabled (private repo on free plan).
# Reports are stored as downloadable artifacts in GitHub Actions.
# To access: Actions tab → select a run → Artifacts section.
# Enable GitHub Pages when the repo becomes public or on upgrade to Pro.

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build-reports:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.1"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Build project
        run: pnpm build

      - name: Generate bundle analysis
        run: |
          mkdir -p reports/bundle-analysis
          cp dist/stats.html reports/bundle-analysis/index.html 2>/dev/null \
            || echo "[warning] No bundle stats found — skipping"

      - name: Generate test coverage
        continue-on-error: true
        run: |
          mkdir -p reports/coverage
          pnpm test:coverage || true
          cp -r coverage/. reports/coverage/ 2>/dev/null \
            || echo "[warning] No coverage report found — skipping"

      - name: Upload reports artifact
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.ref_name }}-${{ github.run_number }}
          path: reports/
          retention-days: 30
