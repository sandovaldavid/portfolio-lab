name: Publish Reports

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-reports:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Build project
        run: pnpm build

      - name: Generate bundle analysis
        run: |
          mkdir -p reports/bundle-analysis
          cp dist/stats.html reports/bundle-analysis/index.html 2>/dev/null \
            || echo "[warning] No bundle stats found — skipping"

      - name: Generate test coverage
        continue-on-error: true
        run: |
          mkdir -p reports/coverage
          pnpm test:coverage || true
          cp -r coverage/. reports/coverage/ 2>/dev/null \
            || echo "[warning] No coverage report found — skipping"

      - name: Generate index page
        run: cp .github/reports-template.html reports/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/

  deploy-pages:
    needs: build-reports
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
