name: Publish Reports

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-reports:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Build project
        run: pnpm build

      - name: Generate bundle analysis
        run: |
          mkdir -p reports/bundle-analysis
          cp dist/stats.html reports/bundle-analysis/index.html 2>/dev/null \
            || echo "[warning] No bundle stats found — skipping"

      - name: Generate test coverage
        continue-on-error: true
        run: |
          mkdir -p reports/coverage
          pnpm test:coverage || true
          cp -r coverage/. reports/coverage/ 2>/dev/null \
            || echo "[warning] No coverage report found — skipping"

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Start production server
        run: node dist/analog/server/index.mjs &
        env:
          PORT: 3000

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CI: true
          BASE_URL: http://localhost:3000

      - name: Generate E2E report
        continue-on-error: true
        run: |
          mkdir -p reports/e2e
          cp -r playwright-report/. reports/e2e/ 2>/dev/null \
            || echo "[warning] No Playwright report found — skipping"

      - name: Generate index page
        run: cp .github/reports-template.html reports/index.html

      - name: Deploy Reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          keep_files: true
