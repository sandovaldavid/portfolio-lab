name: Publish Reports

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-reports:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Build project
        run: pnpm build

      - name: Generate bundle analysis
        run: |
          mkdir -p reports/bundle-analysis
          cp dist/stats.html reports/bundle-analysis/index.html 2>/dev/null \
            || echo "[warning] No bundle stats found — skipping"

      - name: Generate test coverage
        continue-on-error: true
        run: |
          mkdir -p reports/coverage
          pnpm test:coverage || true
          cp -r coverage/. reports/coverage/ 2>/dev/null \
            || echo "[warning] No coverage report found — skipping"

      - name: Generate index page
        run: |
          cat > reports/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>Portfolio Reports</title>
            <style>
              body { font-family: monospace; max-width: 600px; margin: 4rem auto; padding: 0 1rem; }
              h1 { font-size: 1.25rem; }
              ul { line-height: 2; }
              a { color: #0070f3; }
              p { color: #666; font-size: .875rem; }
            </style>
          </head>
          <body>
            <h1>Portfolio Reports</h1>
            <ul>
              <li><a href="bundle-analysis/">Bundle Analysis</a></li>
              <li><a href="coverage/">Test Coverage</a></li>
            </ul>
          </body>
          </html>
          HTMLEOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/

  deploy-pages:
    needs: build-reports
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
