name: Release

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: write

jobs:
  release:
    name: ${{ github.ref == 'refs/heads/main' && 'Stable release' || 'Beta prerelease' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release (stable)
        if: github.ref == 'refs/heads/main'
        run: |
          FIRST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -v -- '-' | sort -V | head -1)
          if [ -z "$FIRST_TAG" ]; then
            pnpm release --ci --increment=1.0.0 --no-git.commit --no-git.requireCleanWorkingDir --no-hooks
          else
            pnpm release --ci --no-git.commit --no-git.requireCleanWorkingDir --no-hooks
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release (beta)
        if: github.ref == 'refs/heads/develop'
        run: |
          FIRST_TAG=$(git tag -l 'v[0-9]*' | sort -V | head -1)
          if [ -z "$FIRST_TAG" ]; then
            pnpm release --ci --increment=1.0.0-beta.0 --no-git.commit --no-git.requireCleanWorkingDir --no-hooks
          else
            pnpm release --ci --no-git.commit --no-git.requireCleanWorkingDir --no-hooks --preRelease=beta
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
