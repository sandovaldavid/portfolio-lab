name: Branch Guard

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify source is develop
        if: github.head_ref != 'develop'
        run: |
          echo "❌ Only PRs from 'develop' can merge to 'main'"
          exit 1
      - name: OK
        run: echo "✅ PR source is develop"
