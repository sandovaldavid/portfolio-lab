name: Branch Guard

on:
  pull_request:
    branches: [main]

jobs:
  Source Branch Check:
    name: Source Branch Check
    runs-on: ubuntu-latest
    steps:
      - name: Verify source is develop
        if: github.head_ref != 'develop'
        run: |
          echo "❌ PRs to main must come from 'develop' branch"
          echo "Current branch: ${{ github.head_ref }}"
          exit 1

      - name: OK
        run: echo "✅ Source branch is develop"
