name: Security Lockfile Refresh

on:
  push:
    branches:
      - chore/security-lockfile-refresh-20260810

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: chore/security-lockfile-refresh-20260810

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm

      - name: Install current lockfile
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile

      - name: Apply non-forced audit fixes
        env:
          HUSKY: 0
        run: pnpm audit --fix || true

      - name: Normalize lockfile
        env:
          HUSKY: 0
        run: pnpm install --lockfile-only

      - name: Verify security audit
        run: pnpm audit --audit-level=high

      - name: Remove one-off workflow and commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/security-lockfile-refresh.yml
          git add package.json pnpm-lock.yaml
          git diff --cached --check
          git commit -m "fix(deps): remediate transitive audit vulnerabilities"
          git push origin HEAD:chore/security-lockfile-refresh-20260810
