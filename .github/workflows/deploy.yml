name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - main
      - develop

permissions:
  contents: read
  deployments: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Build project
        run: pnpm build
        env:
          BUILD_PRESET: vercel

      - name: Create deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        id: deployment
        with:
          script: |
            const isProd = '${{ github.event.workflow_run.head_branch }}' === 'main';
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: '${{ github.event.workflow_run.head_sha }}',
              environment: isProd ? 'production' : 'preview',
              auto_merge: false,
              required_contexts: [],
              production_environment: isProd
            });
            core.setOutput('deployment_id', deployment.data.id);
            core.setOutput('is_prod', isProd);

      - name: Deploy to Vercel
        id: vercel
        run: |
          set -o pipefail
          npx vercel deploy --prebuilt --yes ${{ steps.deployment.outputs.is_prod == 'true' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee deploy_output.txt
          DEPLOY_URL=$(grep -oP 'https://[a-z0-9-]+\.vercel\.app' deploy_output.txt | head -1)
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "[success] Deployed to: $DEPLOY_URL"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Update deployment status (success)
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const isProd = ${{ steps.deployment.outputs.is_prod }};
            const environmentUrl = isProd ? 'https://devsandoval.me' : '${{ steps.vercel.outputs.deploy_url }}';
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.deployment_id }},
              state: 'success',
              description: 'Deployment successful',
              environment_url: environmentUrl
            });

      - name: Update deployment status (failure)
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.deployment_id }},
              state: 'failure',
              description: 'Deployment failed'
            });

      - name: Comment preview URL on open PR
        if: success() && github.event.workflow_run.head_branch == 'develop'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const deployUrl = '${{ steps.vercel.outputs.deploy_url }}';
            if (!deployUrl) return;

            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:develop`,
              base: 'main',
              state: 'open',
            });
            if (prs.length === 0) return;

            const pr = prs[0];
            const marker = '<!-- vercel-preview -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            const headSha = '${{ github.event.workflow_run.head_sha }}';
            const body = `${marker}\n[info] **Preview deployment ready**\n\n| | |\n|---|---|\n| **URL** | ${deployUrl} |\n| **Commit** | ${headSha.slice(0, 7)} |\n\nFull report: [Actions run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }
