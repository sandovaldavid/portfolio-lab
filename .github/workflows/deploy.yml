name: Deploy

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  deployments: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - run: pnpm build
        env:
          BUILD_PRESET: vercel
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: .vercel/output
          include-hidden-files: true
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: .vercel/output

      - name: Create deployment
        uses: actions/github-script@v9
        id: deployment
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              environment: "${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}",
              auto_merge: false,
              required_contexts: [],
              production_environment: ${{ github.ref == 'refs/heads/main' }}
            });
            core.setOutput('deployment_id', deployment.data.id);

      - name: Deploy to Vercel
        id: vercel
        run: |
          set -o pipefail
          npx vercel deploy --prebuilt --yes ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee deploy_output.txt
          DEPLOY_URL=$(grep -oP 'https://[a-z0-9-]+\.vercel\.app' deploy_output.txt | head -1)
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "[success] Deployed to: $DEPLOY_URL"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}



      - name: Update deployment status (success)
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.deployment_id }},
              state: 'success',
              description: 'Deployment successful',
              environment_url: '${{ steps.vercel.outputs.deploy_url }}'
            });

      - name: Update deployment status (failure)
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.deployment_id }},
              state: 'failure',
              description: 'Deployment failed'
            });

      - name: Comment preview URL on open PR
        if: success() && github.ref == 'refs/heads/develop'
        uses: actions/github-script@v9
        with:
          script: |
            const deployUrl = '${{ steps.vercel.outputs.deploy_url }}';
            if (!deployUrl) return;

            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:develop`,
              base: 'main',
              state: 'open',
            });
            if (prs.length === 0) return;

            const pr = prs[0];
            const marker = '<!-- vercel-preview -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            const body = `${marker}\n[info] **Preview deployment ready**\n\n| | |\n|---|---|\n| **URL** | ${deployUrl} |\n| **Commit** | ${context.sha.slice(0, 7)} |\n\nFull report: [Actions run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }
