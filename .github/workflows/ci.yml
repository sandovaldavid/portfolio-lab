name: CI

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  quality-checks:
    uses: ./.github/workflows/quality-checks.yml
    with:
      run-audit: true
    secrets: inherit

  build:
    runs-on: ubuntu-latest
    needs: quality-checks
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - run: pnpm build
      - name: Check bundle size
        run: |
          BUILD_SIZE=$(du -sh dist | cut -f1)
          echo "[info] Build size: $BUILD_SIZE"
          if [ $(du -s dist | cut -f1) -gt 700 ]; then
            echo "[warning] Bundle size warning: exceeds 700KB"
          fi
