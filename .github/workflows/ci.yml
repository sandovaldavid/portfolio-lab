name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  quality-checks:
    uses: ./.github/workflows/quality-checks.yml
    with:
      run-audit: true
    secrets: inherit

  build:
    runs-on: ubuntu-latest
    needs: quality-checks
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - run: pnpm build
      - name: Cache build output for e2e/lighthouse
        uses: actions/cache@v4
        with:
          path: dist
          key: dist-${{ github.sha }}
      - name: Check bundle size
        run: |
          BUDGET_KB=500
          CLIENT_DIR="dist/analog/public/assets"
          TOTAL_KB=$(du -ck "$CLIENT_DIR"/*.js | tail -1 | cut -f1)
          LARGEST=$(du -k "$CLIENT_DIR"/*.js | sort -rn | head -1)
          LARGEST_KB=$(echo "$LARGEST" | cut -f1)
          LARGEST_FILE=$(echo "$LARGEST" | cut -f2)
          echo "[info] Total client JS: ${TOTAL_KB} KB"
          echo "[info] Largest chunk: ${LARGEST_FILE} (${LARGEST_KB} KB, budget ${BUDGET_KB} KB)"
          if [ "$LARGEST_KB" -gt "$BUDGET_KB" ]; then
            echo "[error] A JS chunk exceeds the ${BUDGET_KB}KB budget (chunkSizeWarningLimit in vite.config.ts)"
            exit 1
          fi
      - name: Upload bundle stats
        uses: actions/upload-artifact@v7
        with:
          name: bundle-stats
          path: dist/stats.html
          retention-days: 14
