name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  quality-checks:
    uses: ./.github/workflows/quality-checks.yml
    with:
      run-audit: true
    secrets: inherit

  build:
    runs-on: ubuntu-latest
    needs: quality-checks
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - run: pnpm build
      - name: Cache build output for e2e/lighthouse
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist
          key: dist-${{ github.sha }}
      - name: Check bundle size
        run: |
          BUDGET_KB=500
          CLIENT_DIR="dist/analog/public/assets"
          TOTAL_KB=$(du -ck "$CLIENT_DIR"/*.js | tail -1 | cut -f1)
          LARGEST=$(du -k "$CLIENT_DIR"/*.js | sort -rn | head -1)
          LARGEST_KB=$(echo "$LARGEST" | cut -f1)
          LARGEST_FILE=$(echo "$LARGEST" | cut -f2)
          echo "[info] Total client JS: ${TOTAL_KB} KB"
          echo "[info] Largest chunk: ${LARGEST_FILE} (${LARGEST_KB} KB, budget ${BUDGET_KB} KB)"
          if [ "$LARGEST_KB" -gt "$BUDGET_KB" ]; then
            echo "[error] A JS chunk exceeds the ${BUDGET_KB}KB budget (chunkSizeWarningLimit in vite.config.ts)"
            exit 1
          fi
      - name: Upload bundle stats
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bundle-stats
          path: dist/stats.html
          retention-days: 14
