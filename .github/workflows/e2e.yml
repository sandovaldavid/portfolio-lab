name: E2E Tests

on:
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: '0 2 * * 0'

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  playwright:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build project
        run: pnpm build

      - name: Start production server
        run: node dist/analog/server/index.mjs &
        env:
          PORT: 3000

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CI: true
          BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Deploy Playwright Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          destination_dir: playwright-report/${{ github.event.pull_request.number || 'develop' }}
          keep_files: true

      - name: Comment PR with test results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'test-results/playwright.json';
            if (fs.existsSync(reportPath)) {
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              const stats = report.stats || {};
              const passed = stats.unexpected ? stats.expected - stats.unexpected : 0;
              const prNumber = context.issue.number;
              const body = `### 🎭 Playwright E2E Test Results\n\n- **Total Tests**: ${stats.expected || 0}\n- **Passed**: ${passed}\n- **Failed**: ${stats.unexpected || 0}\n\n📖 **[View Interactive HTML Report](https://sandovaldavid.github.io/portfolio/playwright-report/${prNumber}/)**`;
              github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
