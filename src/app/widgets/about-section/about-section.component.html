<div class="space-y-8">
  <!-- Bio + Photo -->
  <div class="surface-card p-6 md:p-8" appScrollObserver>
    <div class="flex flex-col md:flex-row gap-8 items-start">
      <img
        src="/profile/perfil.webp"
        alt="David Sandoval profile photo"
        class="w-36 h-36 md:w-44 md:h-44 object-cover card-border-primary shrink-0"
        loading="lazy"
      />
      <div class="space-y-4 font-body text-base text-[--color-text] leading-relaxed">
        <p [innerHTML]="'about-me.paragraph1' | translate"></p>
        <p [innerHTML]="'about-me.paragraph2' | translate"></p>
        @if (!compact()) {
          <p [innerHTML]="'about-me.paragraph3' | translate"></p>
        }
      </div>
    </div>
  </div>

  <!-- Currently focused -->
  <div class="surface-card p-6 md:p-8" appScrollObserver>
    <p class="font-pixel text-sm text-[--color-primary] mb-6">
      {{ 'about-me.currently-focused' | translate }}
    </p>
    <ul class="grid grid-cols-1 md:grid-cols-2 gap-4">
      @for (key of focusKeys; track key) {
        <li class="flex items-start gap-3 text-base font-body text-[--color-text] leading-relaxed">
          <span class="text-[--color-primary] shrink-0 font-pixel text-sm mt-0.5">&gt;</span>
          {{ key | translate }}
        </li>
      }
    </ul>
  </div>
</div>
