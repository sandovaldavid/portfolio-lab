<div class="resume-header">
	<h1 class="resume-name">{{ owner.fullName }}</h1>
	<p class="resume-title">{{ i18n.t()('hero.subtitle') }}</p>
	<div class="resume-contact">
		<span>{{ owner.location }}</span>
		<span class="separator">·</span>
		<a [href]="'mailto:' + owner.email">{{ owner.email }}</a>
		<span class="separator">·</span>
		<a [href]="owner.linkedin" target="_blank" rel="noopener">linkedin.com/in/sandovaldavid</a>
		<span class="separator">·</span>
		<a [href]="owner.github" target="_blank" rel="noopener">github.com/sandovaldavid</a>
		<span class="separator">·</span>
		<a [href]="owner.siteUrl" target="_blank" rel="noopener">devsandoval.me</a>
	</div>
</div>
