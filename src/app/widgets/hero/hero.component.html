<section
  class="relative min-h-[calc(100svh-4rem)] flex items-center justify-center overflow-hidden grid-bg"
  aria-label="Hero section"
>
  <!-- Gradient vignette -->
  <div
    class="absolute inset-0 bg-[radial-gradient(ellipse_80%_60%_at_50%_40%,transparent,var(--color-bg)_75%)] pointer-events-none"
    aria-hidden="true"
  ></div>

  <!-- Glow behind heading -->
  <div
    class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[42rem] h-64 bg-[radial-gradient(ellipse,color-mix(in_srgb,var(--color-primary)_14%,transparent),transparent_70%)] pointer-events-none blur-2xl"
    aria-hidden="true"
  ></div>

  <div class="relative z-10 w-full max-w-5xl mx-auto px-4 sm:px-6 py-16 flex flex-col items-center text-center">

    <!-- Available badge -->
    <div class="inline-flex items-center gap-2 mb-10 px-4 py-2 surface-card cursor-default hero-item stagger-0 hero-status-badge">
      <span
        class="w-2.5 h-2.5 inline-block rounded-full bg-[--color-success] animate-[cursor-blink_1.5s_step-end_infinite] shrink-0"
        aria-hidden="true"
      ></span>
      <span class="font-pixel text-sm text-[--color-success] tracking-widest">
        {{ i18n.t()('hero.available') }}
      </span>
    </div>

    <!-- Name + Typewriter block -->
    <div class="mb-4 hero-item stagger-1">
      <p class="font-pixel text-sm md:text-base text-[--color-muted] mb-2 tracking-widest uppercase">
        {{ i18n.t()('hero.intro') }}
      </p>

      <h1 class="font-pixel text-5xl sm:text-6xl md:text-7xl lg:text-8xl text-[--color-text] leading-[1.05] tracking-tight mb-4">
        {{ i18n.t()('hero.name') }}
      </h1>

      <div class="font-pixel text-lg sm:text-xl md:text-2xl text-[--color-primary] leading-none mb-3 h-8 flex justify-center items-center">
        <span class="text-[--color-muted] mr-2" aria-hidden="true">&gt;</span>
        <span>{{ displayedText() }}</span>
        <span
          class="typewriter-cursor text-[--color-primary] animate-[cursor-blink_0.8s_step-end_infinite]"
          aria-hidden="true"
        >▌</span>
      </div>
    </div>

    <!-- Role & company -->
    <div class="mb-3 hero-item stagger-2">
      <p class="font-pixel text-lg md:text-xl text-[--color-primary] leading-snug">
        {{ i18n.t()('hero.role') }}
      </p>
    </div>

    <p class="font-body text-base md:text-lg text-[--color-muted] max-w-2xl mx-auto leading-relaxed mb-10 hero-item stagger-2">
      {{ i18n.t()('hero.company-desc') }}
    </p>

    <!-- CTAs -->
    <div class="flex flex-wrap justify-center gap-4 mb-14 hero-item stagger-3">
      <a
        routerLink="/projects"
        class="inline-flex items-center gap-2.5 font-pixel text-sm md:text-base px-8 py-4 bg-[--color-primary] text-[--color-bg] hover:brightness-110 transition-all duration-150 active:scale-[0.98]"
      >
        <!-- Folder icon -->
        <svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 5a2 2 0 012-2h3l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V5z"/>
        </svg>
        {{ i18n.t()('hero.cta.projects') }}
      </a>
      <a
        [href]="emailHref"
        class="inline-flex items-center gap-2.5 font-pixel text-sm md:text-base px-8 py-4 text-[--color-primary] card-border-primary hover:bg-[color-mix(in_srgb,var(--color-primary)_10%,transparent)] transition-all duration-150 active:scale-[0.98]"
      >
        <!-- Mail icon -->
        <svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="4" width="14" height="10" rx="2"/>
          <path d="M2 6l7 5 7-5"/>
        </svg>
        {{ i18n.t()('hero.cta.contact') }}
      </a>
    </div>

    <!-- Scroll hint -->
    <div class="flex flex-col items-center gap-2 hero-item stagger-4 mt-12" aria-hidden="true">
      <span class="font-pixel text-xs text-[--color-muted] opacity-60 tracking-widest">scroll</span>
      <svg
        width="22" height="22"
        viewBox="0 0 22 22"
        fill="none"
        stroke="var(--color-muted)"
        stroke-width="1.75"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="opacity-50 animate-bounce"
      >
        <path d="M5 8l6 6 6-6"/>
      </svg>
    </div>

  </div>
</section>
