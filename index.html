<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>David Sandoval | Software Engineer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="David Sandoval — Software Engineer specializing in Angular and .NET. Building impactful web applications."
    />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="color-scheme" content="dark light" />

    <!-- PWA -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Prevent FOUC: apply mode + font scale before first paint -->
    <script>
      (function () {
        var m = localStorage.getItem('portfolio_mode');
        document.documentElement.className = m === 'RESEARCH_FELLOW' ? 'mode-research' : 'mode-architect';
        var s = localStorage.getItem('portfolio_font_scale');
        var scales = [13, 15, 17, 19];
        var idx = s !== null ? parseInt(s, 10) : 1;
        if (idx >= 0 && idx <= 3) document.documentElement.style.fontSize = scales[idx] + 'px';
      })();
    </script>

    <!-- Preload critical fonts -->
    <link
      rel="preload"
      href="/node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/node_modules/@fontsource/lora/files/lora-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Global styles -->
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <app-root></app-root>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
